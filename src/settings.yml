---
strategy: polling
no_screen_padding: 'no'
dark_mode: 'no'
static_data: ''
polling_verb: get
framework_version: latest
serverless_language: python
refresh_interval_floor:
polling_url: 'https://api.adsb.lol/v2/point/{% if lat_lon != blank %}{{ lat_lon | split: '','' | first | strip }}/{{ lat_lon | split: '','' | last | strip }}{% else %}{{ latitude }}/{{ longitude }}{% endif %}/{{ radius_nm }}'
polling_headers: Accept=application/json
polling_body: ''
id: 456500
oauth_enabled: 'false'
oauth_pkce_enabled: 'no'
oauth_authorize_url: ''
oauth_token_url: ''
oauth_scopes: ''
oauth_scope_separator: ''
oauth_refresh_url: ''
oauth_auth_params: ''
oauth_token_headers: ''
oauth_token_site: ''
oauth_token_params: ''
oauth_token_request_auth_method: ''
oauth_body_format: ''
oauth_token_response_metadata: ''
oauth_authorization_method: ''
oauth_refresh_params: ''
oauth_token_field_name: ''
oauth_expiry_field_name: ''
oauth_expiry_strategy: ''
oauth_fixed_expiry_ms: ''
custom_fields:
- keyname: lat_lon
  field_type: lat_lon
  name: Observation point
  description: Search for a city, address, or postal code, or enter latitude,longitude.
  placeholder: 37.7749,-122.4194
  group: Location
- keyname: location_label
  field_type: string
  name: Location label
  description: Short label shown on the display.
  placeholder: Home
  default: Home
  maxlength: 30
  group: Location
- keyname: radius_nm
  field_type: number
  min: 1
  max: 250
  step: 1
  name: Search radius
  description: Maximum horizontal distance in nautical miles.
  default: 20
  placeholder: 20
  group: Location
- keyname: map_up_bearing_deg
  field_type: number
  min: 0
  max: 359
  step: 1
  name: Map-up bearing
  description: True compass bearing shown at the top of the radar scope.
  default: 0
  placeholder: 0
  group: Location
- keyname: max_age_minutes
  field_type: number
  min: 1
  max: 60
  step: 1
  name: Maximum position age
  description: Ignore stale aircraft positions older than this many minutes.
  default: 5
  placeholder: 5
- keyname: provider_order
  field_type: select
  name: Provider preference
  description: Paid providers are tried when their credentials are present; ADSB.lol is always the final fallback.
  options:
  - Automatic (FR24 first): auto
  - FlightAware first: flightaware_first
  - ADSB.lol only: open_only
  default: auto
  group: Data providers
- keyname: fr24_api_token
  field_type: password
  name: Flightradar24 API token
  description: Optional paid FR24 API token. Uses Live Flight Positions Full.
  placeholder: Optional
  optional: true
  group: Data providers
- keyname: flightaware_api_key
  field_type: password
  name: FlightAware AeroAPI key
  description: Optional AeroAPI v4 key used when FR24 is unavailable or not preferred.
  placeholder: Optional
  optional: true
  group: Data providers
- keyname: author_bio
  name: About This Plugin
  field_type: author_bio
  description: Built by Barrett in NorCal. Identifies overhead flying objects from public and paid data sources. For support, open an issue on <a href="https://github.com/brwoodside/trmnl-flight-tracker/issues" target="_blank" rel="noopener noreferrer">GitHub</a>. Follow <a href="https://x.com/exploreml" target="_blank" rel="noopener noreferrer">@exploreml on X</a>.
  category: travel
  github_url: https://github.com/brwoodside/trmnl-flight-tracker
name: Overhead Flight Tracker
description: Closest aircraft overhead
refresh_interval: 15
